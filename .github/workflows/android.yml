name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain assembleRelease 2>&1 | tee build.log || {
            # surface the real error as annotations (they are readable without downloading logs)
            grep -E "^e: |error:|What went wrong|^> |Could not|FAILURE|Exception" build.log | head -25 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Sightline.apk
          NOTES="Sightline build ${{ github.run_number }} from commit ${GITHUB_SHA::7}. Download Sightline.apk on your Android phone and open it to install."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest Sightline.apk --clobber
            gh release edit latest --title "Sightline (build ${{ github.run_number }})" --notes "$NOTES"
          else
            gh release create latest Sightline.apk --title "Sightline (build ${{ github.run_number }})" --notes "$NOTES" --latest
          fi
