plugins { id 'com.android.application' }

// The web app lives at the repository root; copy it into the APK's assets at build time,
// so every build ships the same app as the website.
def webRoot = rootProject.file('..')
def wwwOut = file("$buildDir/generated/webassets")
tasks.register('copyWebApp', Copy) {
    from(webRoot) {
        include 'index.html', 'manifest.webmanifest', 'css/**', 'js/**', 'icons/**', 'THIRD-PARTY.md'
    }
    into new File(wwwOut, 'www')
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn 'copyWebApp' }

android {
    namespace 'io.github.bward96.sightline'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.bward96.sightline'
        minSdk 24
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName '1.' + (System.getenv('VERSION_CODE') ?: '0')
    }
    sourceSets { main { assets.srcDirs += [wwwOut] } }
    signingConfigs {
        release {
            storeFile rootProject.file('sightline.keystore')
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'sightline-public'
            keyAlias 'sightline'
            keyPassword System.getenv('KEYSTORE_PASSWORD') ?: 'sightline-public'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
