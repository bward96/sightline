<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sightline</title>
<meta name="description" content="Map the sky you can actually see from your garden, then find out what is in it tonight.">
<meta name="theme-color" content="#080d1c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <button id="spotBtn" class="spot-btn" aria-haspopup="dialog">
      <span class="spot-dot"></span><span id="spotName">Set up</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="top-actions">
      <button id="nightBtn" class="icon-btn" aria-label="Night-vision colours" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
      </button>
      <button id="menuBtn" class="icon-btn" aria-label="Settings and backup">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      </button>
    </div>
  </header>

  <main id="main">
    <section id="view-tonight" class="view" aria-label="Tonight"></section>
    <section id="view-sky" class="view" aria-label="Sky chart" hidden></section>
    <section id="view-horizon" class="view" aria-label="Your horizon" hidden></section>
  </main>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" data-tab="tonight" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/><path d="M17 3v3M15.5 4.5h3"/></svg>
      Tonight
    </button>
    <button class="tab" role="tab" data-tab="sky" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18" opacity=".45"/><circle cx="9" cy="9" r="1" fill="currentColor"/><circle cx="15.5" cy="14" r="1.3" fill="currentColor"/><circle cx="14" cy="7.5" r=".7" fill="currentColor"/></svg>
      Sky
    </button>
    <button class="tab" role="tab" data-tab="horizon" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 19h20"/><path d="M2 19v-4l3-2 2 2 3-5 3 4 2-2 3 3 4-1v5"/><circle cx="17" cy="6" r="2"/></svg>
      Horizon
    </button>
  </nav>
</div>

<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<div id="cap" class="cap" hidden>
  <video id="capVideo" playsinline muted autoplay></video>
  <canvas id="capStill" hidden></canvas>
  <div class="tint"></div>
  <canvas id="capOverlay"></canvas>
  <div class="cap-top">
    <div class="cap-tabs" id="capTabs" role="tablist">
      <button role="tab" data-m="align" aria-selected="true">Align</button>
      <button role="tab" data-m="lens" aria-selected="false">Lens</button>
      <button role="tab" data-m="trace" aria-selected="false">Trace</button>
      <button role="tab" data-m="photo" aria-selected="false">Photo</button>
    </div>
    <button id="capClose" class="icon-btn" aria-label="Close camera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="cap-readout mono" id="capReadout">Waiting for compass…</div>
  <div class="cap-banner" id="capBanner" hidden></div>
  <div class="cap-panel" id="capPanel"></div>
</div>

<script src="js/astronomy.browser.min.js"></script>
<script src="js/data.js"></script>
<script src="js/geo.js"></script>
<script src="js/engine.js"></script>
<script src="js/store.js"></script>
<script src="js/chart.js"></script>
<script src="js/capture.js"></script>
<script src="js/app.js"></script>
</body>
</html>
